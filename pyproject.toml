[project]
name = "sast-review"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Dominik Miklaszewski", email = "dominikmi@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp==1.28.1",
    "pydantic==2.13.5",
    "ruamel-yaml==0.18.15",
]

[project.scripts]
sast-review = "sast_review:main"
sast-review-knowledge = "sast_review.knowledge_mcp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "ruff==0.16.5",
]
